[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bob-mref2-mcp"
version = "2.0.0"
description = "MCP Server for Maximo Real Estate and Facilities (TRIRIGA) Integration with IBM Bob"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "Apache-2.0"}
authors = [
    {name = "IBM", email = "rbhavar@ibm.com"}
]
maintainers = [
    {name = "IBM", email = "rbhavar@ibm.com"}
]
keywords = ["mcp", "tririga", "maximo", "real-estate", "facilities", "ibm", "bob"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mcp>=0.9.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "build>=0.10.0",
    "twine>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/ibm/bob-mref2-mcp"
Documentation = "https://github.com/ibm/bob-mref2-mcp/blob/main/README.md"
Repository = "https://github.com/ibm/bob-mref2-mcp"
Issues = "https://github.com/ibm/bob-mref2-mcp/issues"

[project.scripts]
bob-mref2-mcp = "bob_mref2_mcp.mref_comprehensive_mcp_server:main"
mref-fetch-contracts = "bob_mref2_mcp.fetch_all_contracts_now:main"

[tool.setuptools]
packages = ["bob_mref2_mcp"]

[tool.setuptools.package-data]
bob_mref2_mcp = ["config.json", "*.md"]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]